<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HK Work Assistant</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; --bg:#0b0f14; --panel:#121821; --line:#293341; --text:#e8edf4; --muted:#91a0b4; --accent:#65d6a6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); display:grid; place-items:center; padding:24px; }
    main { width:min(920px,100%); }
    .brand { color:var(--accent); font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:14px 0 10px; font-size:clamp(34px,6vw,64px); letter-spacing:-.05em; line-height:1.04; }
    p { color:var(--muted); line-height:1.6; max-width:680px; }
    .card { margin-top:32px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; }
    .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:20px; }
    .button { display:inline-block; border:1px solid #397d63; background:#1d7054; color:white; text-decoration:none; border-radius:10px; padding:11px 16px; font-weight:650; }
    .button.secondary { border-color:var(--line); background:#171f2b; }
    .status { color:var(--muted); font-size:13px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">RLWRLD · Personal Work Archive</div>
    <h1>놓치지 않는<br>업무 맥락.</h1>
    <p>Slack, 캘린더와 업무 시스템에서 수집한 근거를 바탕으로 타임라인, 할 일, 결정과 응답 대기를 관리합니다.</p>
    <section class="card">
      <div id="login-panel">
        <strong>회사 계정 로그인이 필요합니다.</strong>
        <p>검증된 <code>@rlwrld.ai</code> Google Workspace 계정만 서비스에 접근할 수 있습니다.</p>
        <div class="actions"><a class="button" id="google-login" href="/auth/google/login?next=/">Google로 로그인</a><span class="status" id="login-status"></span></div>
      </div>
      <div id="service-panel" class="hidden">
        <strong id="identity">로그인됨</strong>
        <p>서비스 타임라인과 업무 원장 화면은 다음 구현 단계에서 이 영역에 연결됩니다.</p>
        <div class="actions"><a class="button" href="/backoffice" id="backoffice-link">백오피스</a><button class="button secondary" id="logout">로그아웃</button></div>
      </div>
    </section>
  </main>
  <script>
    let csrf = null;
    async function init() {
      const response = await fetch('/api/v1/session', {credentials:'same-origin'});
      const session = await response.json();
      if (session.authenticated) {
        csrf = session.csrf_token;
        document.getElementById('login-panel').classList.add('hidden');
        document.getElementById('service-panel').classList.remove('hidden');
        document.getElementById('identity').textContent = `${session.email || '로컬 슈퍼 관리자'} · ${session.role}`;
        if (session.role !== 'super_admin') document.getElementById('backoffice-link').classList.add('hidden');
      } else if (!session.google_login_available) {
        document.getElementById('google-login').classList.add('hidden');
        document.getElementById('login-status').textContent = 'Google OAuth 설정이 아직 필요합니다.';
      }
    }
    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/v1/logout', {method:'POST', credentials:'same-origin', headers:{'X-CSRF-Token':csrf, 'Content-Type':'application/json'}, body:'{}'});
      location.reload();
    });
    init();
  </script>
</body>
</html>
