name: rlwrld-worklog

services:
  postgres:
    # pgvector's image is the official postgres image plus the `vector`
    # extension, same major version, so the data volume carries over
    # untouched. e-2 needs the extension and the official image does
    # not ship it; running a second database to hold embeddings would
    # be the mistake this replaced OpenSearch to avoid.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    # Reachable from the host, and only from the host. The nightly collection
    # runs as a systemd user service on this machine, not in this network, so
    # with no published port its load stage could never have succeeded: the
    # `.env` URL names `postgres`, which resolves inside the compose network
    # and nowhere else. On 2026-09-06 the host resolved it to
    # `Temporary failure in name resolution` -- after a `DATABASE_URL` had
    # already been found missing from the batch's environment. Two separate
    # reasons the database was empty, stacked, neither of them visible in a
    # run that reported `ok`.
    #
    # `127.0.0.1:` is not decoration. Written as `5432:5432` the port binds
    # every interface, which on a tailnet host means the database answers the
    # network.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  app:
    build: .
    image: hk-work-assistant-app:local
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      RAW_ARCHIVE_ROOT: ${RAW_ARCHIVE_ROOT:-/data/rlwrld-worklog}
      ALLOWED_GOOGLE_EMAIL: ${ALLOWED_GOOGLE_EMAIL:?set ALLOWED_GOOGLE_EMAIL in .env}
      APP_CONFIG_ROOT: ${APP_CONFIG_ROOT:-/config/hk-work-assistant}
      ADMIN_SESSION_SECURE: ${ADMIN_SESSION_SECURE:-false}
      EMERGENCY_LOGIN_ENABLED: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      - "${VPN_BIND_ADDRESS:?set VPN_BIND_ADDRESS to this host's Tailscale IPv4}:${APP_PORT:-8080}:8080"
      - "${LAN_BIND_ADDRESS:?set LAN_BIND_ADDRESS to this host's LAN IPv4}:${APP_PORT:-8080}:8080"
    volumes:
      - ${RAW_ARCHIVE_HOST_ROOT:-/data/rlwrld-worklog}:/data/rlwrld-worklog:ro
      - ${APP_CONFIG_HOST_ROOT:?set APP_CONFIG_HOST_ROOT in .env}:${APP_CONFIG_ROOT:-/config/hk-work-assistant}:rw
    depends_on:
      postgres:
        condition: service_healthy
    networks: [frontend, backend]

  backoffice-local:
    image: hk-work-assistant-app:local
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["uvicorn", "rlwrld_worklog.web:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      RAW_ARCHIVE_ROOT: ${RAW_ARCHIVE_ROOT:-/data/rlwrld-worklog}
      ALLOWED_GOOGLE_EMAIL: ${ALLOWED_GOOGLE_EMAIL:?set ALLOWED_GOOGLE_EMAIL in .env}
      APP_CONFIG_ROOT: ${APP_CONFIG_ROOT:-/config/hk-work-assistant}
      ADMIN_SESSION_SECURE: "false"
      EMERGENCY_LOGIN_ENABLED: "true"
    ports:
      # Keep the emergency backoffice off the LAN.  Set this to the host's
      # Tailscale IPv4 when VPN access is desired; loopback remains the safe
      # default for a fresh install.
      - "${BACKOFFICE_BIND_ADDRESS:-127.0.0.1}:8081:8081"
    volumes:
      - ${RAW_ARCHIVE_HOST_ROOT:-/data/rlwrld-worklog}:/data/rlwrld-worklog:ro
      - ${APP_CONFIG_HOST_ROOT:?set APP_CONFIG_HOST_ROOT in .env}:${APP_CONFIG_ROOT:-/config/hk-work-assistant}:rw
    depends_on:
      postgres:
        condition: service_healthy
    networks: [frontend, backend]

  # Same backoffice UI on the trusted LAN, but without the emergency password
  # endpoint. The local-only instance above remains the break-glass path.
  backoffice-lan:
    image: hk-work-assistant-app:local
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["uvicorn", "rlwrld_worklog.web:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      RAW_ARCHIVE_ROOT: ${RAW_ARCHIVE_ROOT:-/data/rlwrld-worklog}
      ALLOWED_GOOGLE_EMAIL: ${ALLOWED_GOOGLE_EMAIL:?set ALLOWED_GOOGLE_EMAIL in .env}
      APP_CONFIG_ROOT: ${APP_CONFIG_ROOT:-/config/hk-work-assistant}
      ADMIN_SESSION_SECURE: ${ADMIN_SESSION_SECURE:-false}
      EMERGENCY_LOGIN_ENABLED: "false"
    ports:
      - "${LAN_BIND_ADDRESS:?set LAN_BIND_ADDRESS to this host's LAN IPv4}:8081:8081"
    volumes:
      - ${RAW_ARCHIVE_HOST_ROOT:-/data/rlwrld-worklog}:/data/rlwrld-worklog:ro
      - ${APP_CONFIG_HOST_ROOT:?set APP_CONFIG_HOST_ROOT in .env}:${APP_CONFIG_ROOT:-/config/hk-work-assistant}:rw
    depends_on:
      postgres:
        condition: service_healthy
    networks: [frontend, backend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
