name: rlwrld-worklog

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  opensearch:
    image: opensearchproject/opensearch:3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [backend]

  app:
    build: .
    image: hk-work-assistant-app:local
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      RAW_ARCHIVE_ROOT: ${RAW_ARCHIVE_ROOT:-/data/rlwrld-worklog}
      ALLOWED_GOOGLE_EMAIL: ${ALLOWED_GOOGLE_EMAIL:?set ALLOWED_GOOGLE_EMAIL in .env}
      APP_CONFIG_ROOT: ${APP_CONFIG_ROOT:-/config/hk-work-assistant}
      ADMIN_SESSION_SECURE: ${ADMIN_SESSION_SECURE:-false}
      EMERGENCY_LOGIN_ENABLED: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      - "${VPN_BIND_ADDRESS:?set VPN_BIND_ADDRESS to this host's Tailscale IPv4}:${APP_PORT:-8080}:8080"
      - "${LAN_BIND_ADDRESS:?set LAN_BIND_ADDRESS to this host's LAN IPv4}:${APP_PORT:-8080}:8080"
    volumes:
      - ${RAW_ARCHIVE_HOST_ROOT:-/data/rlwrld-worklog}:/data/rlwrld-worklog:ro
      - ${APP_CONFIG_HOST_ROOT:?set APP_CONFIG_HOST_ROOT in .env}:${APP_CONFIG_ROOT:-/config/hk-work-assistant}:rw
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks: [frontend, backend]

  backoffice-local:
    image: hk-work-assistant-app:local
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["uvicorn", "rlwrld_worklog.web:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      RAW_ARCHIVE_ROOT: ${RAW_ARCHIVE_ROOT:-/data/rlwrld-worklog}
      ALLOWED_GOOGLE_EMAIL: ${ALLOWED_GOOGLE_EMAIL:?set ALLOWED_GOOGLE_EMAIL in .env}
      APP_CONFIG_ROOT: ${APP_CONFIG_ROOT:-/config/hk-work-assistant}
      ADMIN_SESSION_SECURE: "false"
      EMERGENCY_LOGIN_ENABLED: "true"
    ports:
      # Keep the emergency backoffice off the LAN.  Set this to the host's
      # Tailscale IPv4 when VPN access is desired; loopback remains the safe
      # default for a fresh install.
      - "${BACKOFFICE_BIND_ADDRESS:-127.0.0.1}:8081:8081"
    volumes:
      - ${RAW_ARCHIVE_HOST_ROOT:-/data/rlwrld-worklog}:/data/rlwrld-worklog:ro
      - ${APP_CONFIG_HOST_ROOT:?set APP_CONFIG_HOST_ROOT in .env}:${APP_CONFIG_ROOT:-/config/hk-work-assistant}:rw
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks: [frontend, backend]

  # Same backoffice UI on the trusted LAN, but without the emergency password
  # endpoint. The local-only instance above remains the break-glass path.
  backoffice-lan:
    image: hk-work-assistant-app:local
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["uvicorn", "rlwrld_worklog.web:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      RAW_ARCHIVE_ROOT: ${RAW_ARCHIVE_ROOT:-/data/rlwrld-worklog}
      ALLOWED_GOOGLE_EMAIL: ${ALLOWED_GOOGLE_EMAIL:?set ALLOWED_GOOGLE_EMAIL in .env}
      APP_CONFIG_ROOT: ${APP_CONFIG_ROOT:-/config/hk-work-assistant}
      ADMIN_SESSION_SECURE: ${ADMIN_SESSION_SECURE:-false}
      EMERGENCY_LOGIN_ENABLED: "false"
    ports:
      - "${LAN_BIND_ADDRESS:?set LAN_BIND_ADDRESS to this host's LAN IPv4}:8081:8081"
    volumes:
      - ${RAW_ARCHIVE_HOST_ROOT:-/data/rlwrld-worklog}:/data/rlwrld-worklog:ro
      - ${APP_CONFIG_HOST_ROOT:?set APP_CONFIG_HOST_ROOT in .env}:${APP_CONFIG_ROOT:-/config/hk-work-assistant}:rw
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks: [frontend, backend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  opensearch_data:
