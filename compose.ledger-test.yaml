name: rlwrld-ledger-test

services:
  postgres-test:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: worklog_test
      POSTGRES_USER: worklog_test
      POSTGRES_PASSWORD: disposable-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklog_test -d worklog_test"]
      interval: 2s
      timeout: 2s
      retries: 30
