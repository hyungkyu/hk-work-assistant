services:
  collector-slack:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - ${SLACK_ENV_FILE:-./secrets/slack.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      RAW_ARCHIVE_ROOT: ${RAW_ARCHIVE_ROOT:-/data/rlwrld-worklog}
    volumes:
      - ${RAW_ARCHIVE_HOST_ROOT:-/data/rlwrld-worklog}:/data/rlwrld-worklog:rw
    depends_on:
      postgres:
        condition: service_healthy
    networks: [frontend, backend]
    restart: "no"
    command: ["worklog", "doctor", "slack"]
